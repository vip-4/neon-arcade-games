<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON PONG // CYBERPUNK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        :root {
            --neon-cyan: #0ff;
            --neon-magenta: #f0f;
            --neon-yellow: #ff0;
            --neon-purple: #b0f;
            --dark-bg: #0a0a0f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--dark-bg);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 2px,
                rgba(0, 0, 0, 0.15) 4px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .chromatic-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            text-shadow:
                0.05em 0 0 rgba(255, 0, 0, 0.75),
                -0.05em -0.025em 0 rgba(0, 255, 255, 0.75),
                0.025em 0.05em 0 rgba(0, 255, 0, 0.75);
            animation: glitch 2s infinite linear alternate-reverse;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .subtitle {
            font-size: 1rem;
            color: var(--neon-magenta);
            margin-top: 0.5rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            text-shadow:
                0.05em 0 0 rgba(255, 0, 255, 0.5),
                -0.05em 0 0 rgba(0, 255, 255, 0.5);
        }

        .game-container {
            background: #000;
            border: 3px solid var(--neon-cyan);
            border-radius: 15px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            box-shadow:
                0 0 30px rgba(0, 255, 255, 0.3),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
            position: relative;
        }

        .game-container::before {
            content: "";
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta), var(--neon-yellow), var(--neon-cyan));
            background-size: 400% 400%;
            border-radius: 18px;
            z-index: -1;
            animation: borderGlow 4s ease infinite;
        }

        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; opacity: 0.5; }
            50% { background-position: 100% 50%; opacity: 1; }
        }

        #gameCanvas {
            display: block;
            background: #050508;
            border: 2px solid var(--neon-purple);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(176, 0, 255, 0.4);
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding: 0.8rem;
            background: rgba(0, 255, 255, 0.05);
            border: 1px dashed var(--neon-cyan);
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
        }

        .score-display {
            font-size: 1.3rem;
            color: var(--neon-yellow);
            font-weight: 700;
            text-shadow:
                0.05em 0 0 rgba(255, 255, 0, 0.75),
                -0.05em 0 0 rgba(255, 0, 255, 0.75);
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            justify-content: center;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--neon-yellow);
            color: var(--neon-yellow);
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            text-shadow: 0 0 10px var(--neon-yellow);
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.3);
            border-radius: 8px;
        }

        .btn:hover {
            background: var(--neon-yellow);
            color: #000;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.8);
        }

        .instructions {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--neon-cyan);
            opacity: 0.8;
            text-align: center;
            line-height: 1.6;
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            z-index: 100;
            display: none;
        }

        .game-over-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow:
                0.05em 0 0 rgba(255, 0, 0, 0.75),
                -0.05em -0.025em 0 rgba(0, 255, 255, 0.75),
                0.025em 0.05em 0 rgba(0, 255, 0, 0.75);
            animation: glitch 0.5s infinite;
        }

        .final-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--neon-magenta);
            margin-top: 1rem;
        }

        @media (max-width: 640px) {
            .chromatic-text {
                font-size: 2rem;
            }
            .subtitle {
                font-size: 0.8rem;
                letter-spacing: 0.3em;
            }
            .game-container {
                padding: 1rem;
            }
            #gameCanvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="chromatic-text">NEON PONG</div>
        <div class="subtitle">CYBERPUNK EDITION</div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="info-panel">
            <div class="score-display">PLAYER: <span id="playerScore">0</span></div>
            <div class="score-display">CPU: <span id="cpuScore">0</span></div>
        </div>
        <div class="controls">
            <button class="btn" id="startBtn">START</button>
            <button class="btn" id="pauseBtn">PAUSE</button>
        </div>
        <div class="instructions">
            W/S OR ARROW KEYS TO MOVE • FIRST TO 10 WINS<br>
            CPU OPPONENT AVAILABLE
        </div>
        <div class="game-over-overlay" id="gameOverOverlay">
            <div class="game-over-text" id="gameOverText">GAME OVER</div>
            <div class="final-score" id="finalScore">SCORE: 0 - 0</div>
            <button class="btn" id="restartBtn" style="margin-top: 1.5rem;">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const playerScoreDisplay = document.getElementById('playerScore');
        const cpuScoreDisplay = document.getElementById('cpuScore');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const gameOverText = document.getElementById('gameOverText');
        const finalScoreDisplay = document.getElementById('finalScore');

        const PADDLE_WIDTH = 12;
        const PADDLE_HEIGHT = 80;
        const BALL_RADIUS = 8;
        const WIN_SCORE = 10;

        let player = { x: 20, y: canvas.height / 2 - PADDLE_HEIGHT / 2, width: PADDLE_WIDTH, height: PADDLE_HEIGHT, score: 0 };
        let cpu = { x: canvas.width - 20 - PADDLE_WIDTH, y: canvas.height / 2 - PADDLE_HEIGHT / 2, width: PADDLE_WIDTH, height: PADDLE_HEIGHT, score: 0 };
        let ball = { x: canvas.width / 2, y: canvas.height / 2, dx: 4, dy: 4, radius: BALL_RADIUS };
        let gameRunning = false;
        let isPaused = false;
        let gameOver = false;
        let animationId = null;
        let cpuSpeed = 3.5;

        function resetBall(direction) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = direction * 4;
            ball.dy = (Math.random() - 0.5) * 6;
        }

        function resetGame() {
            player.score = 0;
            cpu.score = 0;
            player.y = canvas.height / 2 - PADDLE_HEIGHT / 2;
            cpu.y = canvas.height / 2 - PADDLE_HEIGHT / 2;
            playerScoreDisplay.textContent = '0';
            cpuScoreDisplay.textContent = '0';
            gameOver = false;
            isPaused = false;
            gameOverOverlay.style.display = 'none';
            pauseBtn.textContent = 'PAUSE';
            resetBall(Math.random() > 0.5 ? 1 : -1);
            draw();
        }

        function draw() {
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 20) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.shadowColor = '#0ff';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#0ff';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.shadowColor = '#f0f';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#f0f';
            ctx.fillRect(cpu.x, cpu.y, cpu.width, cpu.height);

            ctx.shadowColor = '#ff0';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ff0';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function update() {
            if (!gameRunning || isPaused) return;

            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.dy = -ball.dy;
            }

            if (ball.x - ball.radius < player.x + player.width && ball.y > player.y && ball.y < player.y + player.height) {
                let hitPoint = (ball.y - (player.y + player.height / 2)) / (player.height / 2);
                let angle = hitPoint * (Math.PI / 4);
                let speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                speed = Math.min(speed + 0.2, 10);
                ball.dx = speed * Math.cos(angle);
                ball.dy = speed * Math.sin(angle);
                ball.x = player.x + player.width + ball.radius;
            }

            if (ball.x + ball.radius > cpu.x && ball.y > cpu.y && ball.y < cpu.y + cpu.height) {
                let hitPoint = (ball.y - (cpu.y + cpu.height / 2)) / (cpu.height / 2);
                let angle = hitPoint * (Math.PI / 4);
                let speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                speed = Math.min(speed + 0.2, 10);
                ball.dx = -speed * Math.cos(angle);
                ball.dy = speed * Math.sin(angle);
                ball.x = cpu.x - ball.radius;
            }

            if (ball.x + ball.radius < 0) {
                cpu.score++;
                cpuScoreDisplay.textContent = cpu.score;
                if (cpu.score >= WIN_SCORE) {
                    endGame(false);
                } else {
                    resetBall(1);
                }
            }

            if (ball.x - ball.radius > canvas.width) {
                player.score++;
                playerScoreDisplay.textContent = player.score;
                if (player.score >= WIN_SCORE) {
                    endGame(true);
                } else {
                    resetBall(-1);
                }
            }

            let cpuCenter = cpu.y + cpu.height / 2;
            if (cpuCenter < ball.y - 10) {
                cpu.y += cpuSpeed;
            } else if (cpuCenter > ball.y + 10) {
                cpu.y -= cpuSpeed;
            }
            if (cpu.y < 0) cpu.y = 0;
            if (cpu.y + cpu.height > canvas.height) cpu.y = canvas.height - cpu.height;

            draw();
            animationId = requestAnimationFrame(update);
        }

        function startGame() {
            if (gameRunning && !isPaused) return;
            if (gameOver) resetGame();
            if (!gameRunning) {
                gameRunning = true;
                startBtn.textContent = 'PLAYING';
            }
            if (isPaused) {
                isPaused = false;
                pauseBtn.textContent = 'PAUSE';
            }
            update();
        }

        function pauseGame() {
            if (!gameRunning || gameOver) return;
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? 'RESUME' : 'PAUSE';
            if (!isPaused) update();
        }

        function endGame(playerWon) {
            gameOver = true;
            gameRunning = false;
            cancelAnimationFrame(animationId);
            gameOverText.textContent = playerWon ? 'YOU WIN!' : 'GAME OVER';
            finalScoreDisplay.textContent = `SCORE: ${player.score} - ${cpu.score}`;
            gameOverOverlay.style.display = 'flex';
            startBtn.textContent = 'START';
            pauseBtn.textContent = 'PAUSE';
        }

        function handleKeydown(e) {
            if (gameOver) return;
            if (e.code === 'Space') {
                e.preventDefault();
                if (!gameRunning) {
                    startGame();
                } else {
                    pauseGame();
                }
            }
            if (gameRunning && !isPaused) {
                if ((e.code === 'ArrowUp' || e.code === 'KeyW') && player.y > 0) {
                    player.y -= 20;
                }
                if ((e.code === 'ArrowDown' || e.code === 'KeyS') && player.y + player.height < canvas.height) {
                    player.y += 20;
                }
                draw();
            }
        }

        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', pauseGame);
        restartBtn.addEventListener('click', () => {
            resetGame();
            startGame();
        });
        document.addEventListener('keydown', handleKeydown);

        resetGame();
        draw();
    </script>
</body>
</html>
