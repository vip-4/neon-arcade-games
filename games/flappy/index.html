<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON FLAP // CYBERPUNK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        :root {
            --neon-cyan: #0ff;
            --neon-magenta: #f0f;
            --neon-yellow: #ff0;
            --neon-purple: #b0f;
            --dark-bg: #0a0a0f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--dark-bg);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 2px,
                rgba(0, 0, 0, 0.15) 4px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .chromatic-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            text-shadow:
                0.05em 0 0 rgba(255, 0, 0, 0.75),
                -0.05em -0.025em 0 rgba(0, 255, 255, 0.75),
                0.025em 0.05em 0 rgba(0, 255, 0, 0.75);
            animation: glitch 2s infinite linear alternate-reverse;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .subtitle {
            font-size: 1rem;
            color: var(--neon-magenta);
            margin-top: 0.5rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            text-shadow:
                0.05em 0 0 rgba(255, 0, 255, 0.5),
                -0.05em 0 0 rgba(0, 255, 255, 0.5);
        }

        .game-container {
            background: #000;
            border: 3px solid var(--neon-cyan);
            border-radius: 15px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            box-shadow:
                0 0 30px rgba(0, 255, 255, 0.3),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
            position: relative;
        }

        .game-container::before {
            content: "";
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta), var(--neon-yellow), var(--neon-cyan));
            background-size: 400% 400%;
            border-radius: 18px;
            z-index: -1;
            animation: borderGlow 4s ease infinite;
        }

        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; opacity: 0.5; }
            50% { background-position: 100% 50%; opacity: 1; }
        }

        #gameCanvas {
            display: block;
            background: #050508;
            border: 2px solid var(--neon-purple);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(176, 0, 255, 0.4);
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding: 0.8rem;
            background: rgba(0, 255, 255, 0.05);
            border: 1px dashed var(--neon-cyan);
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
        }

        .score-display {
            font-size: 1.3rem;
            color: var(--neon-yellow);
            font-weight: 700;
            text-shadow:
                0.05em 0 0 rgba(255, 255, 0, 0.75),
                -0.05em 0 0 rgba(255, 0, 255, 0.75);
        }

        .high-score {
            font-size: 1rem;
            color: var(--neon-magenta);
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            justify-content: center;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--neon-yellow);
            color: var(--neon-yellow);
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            text-shadow: 0 0 10px var(--neon-yellow);
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.3);
            border-radius: 8px;
        }

        .btn:hover {
            background: var(--neon-yellow);
            color: #000;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.8);
        }

        .instructions {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--neon-cyan);
            opacity: 0.8;
            text-align: center;
            line-height: 1.6;
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            z-index: 100;
            display: none;
        }

        .game-over-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow:
                0.05em 0 0 rgba(255, 0, 0, 0.75),
                -0.05em -0.025em 0 rgba(0, 255, 255, 0.75),
                0.025em 0.05em 0 rgba(0, 255, 0, 0.75);
            animation: glitch 0.5s infinite;
        }

        .final-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--neon-magenta);
            margin-top: 1rem;
        }

        @media (max-width: 640px) {
            .chromatic-text {
                font-size: 2rem;
            }
            .subtitle {
                font-size: 0.8rem;
                letter-spacing: 0.3em;
            }
            .game-container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="chromatic-text">NEON FLAP</div>
        <div class="subtitle">CYBERPUNK EDITION</div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        <div class="info-panel">
            <div class="score-display">SCORE: <span id="score">0</span></div>
            <div class="high-score">BEST: <span id="highScore">0</span></div>
        </div>
        <div class="controls">
            <button class="btn" id="startBtn">START</button>
        </div>
        <div class="instructions">
            SPACE / CLICK / TAP TO FLAP<br>
            AVOID PIPES • FLY AS FAR AS YOU CAN
        </div>
        <div class="game-over-overlay" id="gameOverOverlay">
            <div class="game-over-text">GAME OVER</div>
            <div class="final-score">SCORE: <span id="finalScore">0</span></div>
            <button class="btn" id="restartBtn" style="margin-top: 1.5rem;">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreDisplay = document.getElementById('finalScore');

        let bird = { x: 80, y: 250, width: 30, height: 30, velocity: 0 };
        let pipes = [];
        let score = 0;
        let highScore = parseInt(localStorage.getItem('flapHighScore')) || 0;
        let gameRunning = false;
        let gameOver = false;
        let frameCount = 0;

        highScoreDisplay.textContent = highScore;

        function resetGame() {
            bird = { x: 80, y: 250, width: 30, height: 30, velocity: 0 };
            pipes = [];
            score = 0;
            frameCount = 0;
            gameOver = false;
            scoreDisplay.textContent = '0';
            gameOverOverlay.style.display = 'none';
        }

        function flap() {
            if (!gameRunning) {
                gameRunning = true;
                startBtn.textContent = 'PLAYING';
                gameLoop();
            }
            bird.velocity = -6;
        }

        function spawnPipe() {
            const minGap = 140;
            const maxGap = 180;
            const gap = minGap + Math.random() * (maxGap - minGap);
            const minY = 60;
            const maxY = canvas.height - 60 - gap;
            const topHeight = minY + Math.random() * (maxY - minY);
            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                gap: gap,
                width: 50,
                passed: false
            });
        }

        function update() {
            bird.velocity += 0.35;
            bird.y += bird.velocity;

            if (bird.y < 0) {
                bird.y = 0;
                bird.velocity = 0;
            }
            if (bird.y + bird.height > canvas.height) {
                bird.y = canvas.height - bird.height;
                endGame();
                return;
            }

            frameCount++;
            if (frameCount % 100 === 0) spawnPipe();

            pipes.forEach(pipe => {
                pipe.x -= 2.5;

                if (!pipe.passed && pipe.x + pipe.width < bird.x) {
                    pipe.passed = true;
                    score++;
                    scoreDisplay.textContent = score;
                }

                if (
                    bird.x < pipe.x + pipe.width &&
                    bird.x + bird.width > pipe.x &&
                    (bird.y < pipe.topHeight || bird.y + bird.height > pipe.topHeight + pipe.gap)
                ) {
                    endGame();
                }
            });

            pipes = pipes.filter(pipe => pipe.x + pipe.width > 0);

            if (pipes.length > 0 && pipes[0].x < -50) {
                pipes.shift();
            }
        }

        function draw() {
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 20) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            pipes.forEach(pipe => {
                ctx.shadowColor = '#f0f';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#f0f';
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.topHeight);
                ctx.fillRect(pipe.x, pipe.topHeight + pipe.gap, pipe.width, canvas.height - pipe.topHeight - pipe.gap);
                ctx.shadowBlur = 0;
            });

            ctx.shadowColor = '#ff0';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ff0';
            ctx.beginPath();
            ctx.moveTo(bird.x + bird.width / 2, bird.y);
            ctx.lineTo(bird.x + bird.width, bird.y + bird.height / 2);
            ctx.lineTo(bird.x, bird.y + bird.height / 2);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            if (!gameOver) requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameOver = true;
            gameRunning = false;
            if (score > highScore) {
                highScore = score;
                highScoreDisplay.textContent = highScore;
                localStorage.setItem('flapHighScore', highScore);
            }
            finalScoreDisplay.textContent = score;
            gameOverOverlay.style.display = 'flex';
            startBtn.textContent = 'START';
        }

        function handleKeydown(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameOver) {
                    resetGame();
                    flap();
                } else {
                    flap();
                }
            }
        }

        function handleTouch(e) {
            e.preventDefault();
            if (gameOver) {
                resetGame();
                flap();
            } else {
                flap();
            }
        }

        startBtn.addEventListener('click', () => {
            if (gameOver) {
                resetGame();
            }
            flap();
        });
        restartBtn.addEventListener('click', () => {
            resetGame();
            flap();
        });
        document.addEventListener('keydown', handleKeydown);
        canvas.addEventListener('touchstart', handleTouch, { passive: false });
        canvas.addEventListener('mousedown', handleTouch);

        resetGame();
        draw();
    </script>
</body>
</html>
