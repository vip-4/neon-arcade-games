<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON WHACK // CYBERPUNK REACTION GAME</title>
    <meta name="description" content="NEON WHACK is a fast-paced cyberpunk reaction game. Whack neon targets before they disappear. Free browser-based arcade game.">
    <meta name="keywords" content="reaction game, cyberpunk game, browser game, neon game, whack-a-mole, free online game, static HTML game, arcade game">
    <meta name="author" content="Neon Arcade">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://neon-whack.pages.dev/">
    <meta property="og:title" content="NEON WHACK - Cyberpunk Reaction Game">
    <meta property="og:description" content="Fast-paced neon reaction challenge. Whack targets before they disappear.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://neon-whack.pages.dev/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="NEON WHACK - Cyberpunk Reaction Game">
    <meta name="twitter:description" content="Fast-paced neon reaction challenge.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
        :root {
            --neon-cyan: #0ff;
            --neon-magenta: #f0f;
            --neon-yellow: #ff0;
            --neon-purple: #b0f;
            --dark-bg: #0a0a0f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--dark-bg);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
            pointer-events: none;
            z-index: 1000;
        }
        .chromatic-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0.05em 0 0 rgba(255,0,0,0.75), -0.05em -0.025em 0 rgba(0,255,255,0.75), 0.025em 0.05em 0 rgba(0,255,0,0.75);
            animation: glitch 2s infinite linear alternate-reverse;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        .subtitle {
            font-size: 1rem;
            color: var(--neon-magenta);
            margin-top: 0.5rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            text-shadow: 0.05em 0 0 rgba(255,0,255,0.5), -0.05em 0 0 rgba(0,255,255,0.5);
        }
        .game-container {
            background: #000;
            border: 3px solid var(--neon-cyan);
            border-radius: 15px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            box-shadow: 0 0 30px rgba(0,255,255,0.3), inset 0 0 20px rgba(0,255,255,0.1);
            position: relative;
        }
        .game-container::before {
            content: "";
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta), var(--neon-yellow), var(--neon-cyan));
            background-size: 400% 400%;
            border-radius: 18px;
            z-index: -1;
            animation: borderGlow 4s ease infinite;
        }
        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; opacity: 0.5; }
            50% { background-position: 100% 50%; opacity: 1; }
        }
        #gameCanvas {
            display: block;
            background: #050508;
            border: 2px solid var(--neon-purple);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(176,0,255,0.4);
            cursor: crosshair;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding: 0.8rem;
            background: rgba(0,255,255,0.05);
            border: 1px dashed var(--neon-cyan);
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
        }
        .score-display {
            font-size: 1.3rem;
            color: var(--neon-yellow);
            font-weight: 700;
            text-shadow: 0.05em 0 0 rgba(255,255,0,0.75), -0.05em 0 0 rgba(255,0,255,0.75);
        }
        .high-score {
            font-size: 1rem;
            color: var(--neon-magenta);
        }
        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            justify-content: center;
        }
        .btn {
            background: transparent;
            border: 2px solid var(--neon-yellow);
            color: var(--neon-yellow);
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            text-shadow: 0 0 10px var(--neon-yellow);
            box-shadow: 0 0 15px rgba(255,255,0,0.3);
            border-radius: 8px;
        }
        .btn:hover { background: var(--neon-yellow); color: #000; box-shadow: 0 0 30px rgba(255,255,0,0.8); }
        .instructions {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--neon-cyan);
            opacity: 0.8;
            text-align: center;
            line-height: 1.6;
        }
        .game-over-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            z-index: 100;
            display: none;
        }
        .game-over-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0.05em 0 0 rgba(255,0,0,0.75), -0.05em -0.025em 0 rgba(0,255,255,0.75), 0.025em 0.05em 0 rgba(0,255,0,0.75);
            animation: glitch 0.5s infinite;
        }
        .final-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--neon-magenta);
            margin-top: 1rem;
        }
        @media (max-width: 640px) {
            .chromatic-text { font-size: 2rem; }
            .subtitle { font-size: 0.8rem; letter-spacing: 0.3em; }
            .game-container { padding: 1rem; }
            #gameCanvas { width: 100%; height: auto; }
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="chromatic-text">NEON WHACK</div>
        <div class="subtitle">CYBERPUNK EDITION</div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="info-panel">
            <div class="score-display">SCORE: <span id="score">0</span></div>
            <div class="score-display">TIME: <span id="time">30</span></div>
            <div class="high-score">BEST: <span id="highScore">0</span></div>
        </div>
        <div class="controls">
            <button class="btn" id="startBtn">START</button>
        </div>
        <div class="instructions">
            CLICK OR TAP THE NEON TARGETS BEFORE THEY DISAPPEAR<br>
            MISS 3 TARGETS AND IT'S GAME OVER
        </div>
        <div class="game-over-overlay" id="gameOverOverlay">
            <div class="game-over-text">GAME OVER</div>
            <div class="final-score">SCORE: <span id="finalScore">0</span></div>
            <button class="btn" id="restartBtn" style="margin-top: 1.5rem;">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const timeDisplay = document.getElementById('time');
        const highScoreDisplay = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreDisplay = document.getElementById('finalScore');

        const GRID_SIZE = 4;
        const CELL_SIZE = canvas.width / GRID_SIZE;
        const COLORS = ['#0ff', '#f0f', '#ff0', '#b0f'];

        let targets = [];
        let score = 0;
        let timeLeft = 30;
        let highScore = parseInt(localStorage.getItem('whackHighScore')) || 0;
        let gameRunning = false;
        let gameOver = false;
        let misses = 0;
        let spawnTimer = 0;
        let animationId = null;
        let timerInterval = null;

        highScoreDisplay.textContent = highScore;

        function resetGame() {
            targets = [];
            score = 0;
            timeLeft = 30;
            misses = 0;
            spawnTimer = 0;
            gameOver = false;
            scoreDisplay.textContent = '0';
            timeDisplay.textContent = '30';
            gameOverOverlay.style.display = 'none';
            draw();
        }

        function spawnTarget() {
            const gridX = Math.floor(Math.random() * GRID_SIZE);
            const gridY = Math.floor(Math.random() * GRID_SIZE);
            const x = gridX * CELL_SIZE + CELL_SIZE / 2;
            const y = gridY * CELL_SIZE + CELL_SIZE / 2;
            const color = COLORS[Math.floor(Math.random() * COLORS.length)];
            targets.push({
                x, y, gridX, gridY, color,
                radius: CELL_SIZE / 3,
                life: 60,
                maxLife: 60
            });
        }

        function update() {
            if (!gameRunning || gameOver) return;

            spawnTimer++;
            if (spawnTimer > 40) {
                spawnTarget();
                spawnTimer = 0;
            }

            targets.forEach(t => {
                t.life--;
                t.radius = (CELL_SIZE / 3) * (t.life / t.maxLife);
            });

            targets = targets.filter(t => t.life > 0);

            if (targets.length > 0 && targets[0].life <= 0) {
                misses++;
                targets.shift();
                if (misses >= 3) {
                    endGame();
                    return;
                }
            }

            draw();
            animationId = requestAnimationFrame(update);
        }

        function draw() {
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(0,255,255,0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            targets.forEach(t => {
                ctx.shadowColor = t.color;
                ctx.shadowBlur = 20;
                ctx.fillStyle = t.color;
                ctx.beginPath();
                ctx.arc(t.x, t.y, Math.max(1, t.radius), 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(t.x, t.y, Math.max(0.5, t.radius * 0.3), 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function startGame() {
            if (gameRunning && !gameOver) return;
            if (gameOver) resetGame();
            gameRunning = true;
            startBtn.textContent = 'PLAYING';
            startBtn.disabled = true;
            resetGame();
            timerInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
            update();
        }

        function endGame() {
            gameOver = true;
            gameRunning = false;
            clearInterval(timerInterval);
            cancelAnimationFrame(animationId);
            if (score > highScore) {
                highScore = score;
                highScoreDisplay.textContent = highScore;
                localStorage.setItem('whackHighScore', highScore);
            }
            finalScoreDisplay.textContent = score;
            gameOverOverlay.style.display = 'flex';
            startBtn.textContent = 'START';
            startBtn.disabled = false;
        }

        function handleClick(e) {
            if (!gameRunning || gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            for (let i = targets.length - 1; i >= 0; i--) {
                const t = targets[i];
                const dx = clickX - t.x;
                const dy = clickY - t.y;
                if (Math.sqrt(dx * dx + dy * dy) < t.radius + 10) {
                    score += 10;
                    scoreDisplay.textContent = score;
                    targets.splice(i, 1);
                    draw();
                    break;
                }
            }
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', () => {
            resetGame();
            startGame();
        });
        canvas.addEventListener('click', handleClick);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!gameRunning || gameOver) {
                startGame();
            } else if (e.touches.length > 0) {
                handleClick(e.touches[0]);
            }
        }, { passive: false });

        resetGame();
        draw();
    </script>
</body>
</html>
