<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON RACER // CYBERPUNK RACING GAME</title>
    <meta name="description" content="NEON RACER is a fast-paced cyberpunk racing game. Dodge traffic, collect power-ups, and race through neon city streets. Free browser-based racing game.">
    <meta name="keywords" content="racing game, cyberpunk game, browser game, neon game, car game, free online game, static HTML game, arcade game">
    <meta name="author" content="Neon Arcade">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://neon-racer.pages.dev/">
    <meta property="og:title" content="NEON RACER - Cyberpunk Racing Game">
    <meta property="og:description" content="Race through neon city streets in this fast-paced cyberpunk racing game.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://neon-racer.pages.dev/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="NEON RACER - Cyberpunk Racing Game">
    <meta name="twitter:description" content="Race through neon city streets.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
        :root {
            --neon-cyan: #0ff;
            --neon-magenta: #f0f;
            --neon-yellow: #ff0;
            --neon-purple: #b0f;
            --dark-bg: #0a0a0f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--dark-bg);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
            pointer-events: none;
            z-index: 1000;
        }
        .chromatic-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0.05em 0 0 rgba(255,0,0,0.75), -0.05em -0.025em 0 rgba(0,255,255,0.75), 0.025em 0.05em 0 rgba(0,255,0,0.75);
            animation: glitch 2s infinite linear alternate-reverse;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        .subtitle {
            font-size: 1rem;
            color: var(--neon-magenta);
            margin-top: 0.5rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            text-shadow: 0.05em 0 0 rgba(255,0,255,0.5), -0.05em 0 0 rgba(0,255,255,0.5);
        }
        .game-container {
            background: #000;
            border: 3px solid var(--neon-cyan);
            border-radius: 15px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            box-shadow: 0 0 30px rgba(0,255,255,0.3), inset 0 0 20px rgba(0,255,255,0.1);
            position: relative;
        }
        .game-container::before {
            content: "";
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta), var(--neon-yellow), var(--neon-cyan));
            background-size: 400% 400%;
            border-radius: 18px;
            z-index: -1;
            animation: borderGlow 4s ease infinite;
        }
        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; opacity: 0.5; }
            50% { background-position: 100% 50%; opacity: 1; }
        }
        #gameCanvas {
            display: block;
            background: #050508;
            border: 2px solid var(--neon-purple);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(176,0,255,0.4);
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding: 0.8rem;
            background: rgba(0,255,255,0.05);
            border: 1px dashed var(--neon-cyan);
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
        }
        .score-display {
            font-size: 1.3rem;
            color: var(--neon-yellow);
            font-weight: 700;
            text-shadow: 0.05em 0 0 rgba(255,255,0,0.75), -0.05em 0 0 rgba(255,0,255,0.75);
        }
        .high-score {
            font-size: 1rem;
            color: var(--neon-magenta);
        }
        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            justify-content: center;
        }
        .btn {
            background: transparent;
            border: 2px solid var(--neon-yellow);
            color: var(--neon-yellow);
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            text-shadow: 0 0 10px var(--neon-yellow);
            box-shadow: 0 0 15px rgba(255,255,0,0.3);
            border-radius: 8px;
        }
        .btn:hover { background: var(--neon-yellow); color: #000; box-shadow: 0 0 30px rgba(255,255,0,0.8); }
        .instructions {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--neon-cyan);
            opacity: 0.8;
            text-align: center;
            line-height: 1.6;
        }
        .game-over-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            z-index: 100;
            display: none;
        }
        .game-over-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0.05em 0 0 rgba(255,0,0,0.75), -0.05em -0.025em 0 rgba(0,255,255,0.75), 0.025em 0.05em 0 rgba(0,255,0,0.75);
            animation: glitch 0.5s infinite;
        }
        .final-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--neon-magenta);
            margin-top: 1rem;
        }
        @media (max-width: 640px) {
            .chromatic-text { font-size: 2rem; }
            .subtitle { font-size: 0.8rem; letter-spacing: 0.3em; }
            .game-container { padding: 1rem; }
            #gameCanvas { width: 100%; height: auto; }
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="chromatic-text">NEON RACER</div>
        <div class="subtitle">CYBERPUNK EDITION</div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="info-panel">
            <div class="score-display">SCORE: <span id="score">0</span></div>
            <div class="score-display">SPEED: <span id="speed">1x</span></div>
            <div class="high-score">BEST: <span id="highScore">0</span></div>
        </div>
        <div class="controls">
            <button class="btn" id="startBtn">START</button>
        </div>
        <div class="instructions">
            LEFT/RIGHT ARROW OR A/D TO STEER<br>
            DODGE TRAFFIC • COLLECT ORBS • SURVIVE AS LONG AS YOU CAN
        </div>
        <div class="game-over-overlay" id="gameOverOverlay">
            <div class="game-over-text">CRASHED</div>
            <div class="final-score">SCORE: <span id="finalScore">0</span></div>
            <button class="btn" id="restartBtn" style="margin-top: 1.5rem;">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const speedDisplay = document.getElementById('speed');
        const highScoreDisplay = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreDisplay = document.getElementById('finalScore');

        const ROAD_WIDTH = 300;
        const LANE_COUNT = 3;
        const LANE_WIDTH = ROAD_WIDTH / LANE_COUNT;
        const ROAD_X = (canvas.width - ROAD_WIDTH) / 2;
        const CAR_WIDTH = 40;
        const CAR_HEIGHT = 70;
        const ORB_RADIUS = 10;

        let player = { x: canvas.width / 2, y: canvas.height - 120, width: CAR_WIDTH, height: CAR_HEIGHT, lane: 1 };
        let traffic = [];
        let orbs = [];
        let score = 0;
        let highScore = parseInt(localStorage.getItem('racerHighScore')) || 0;
        let gameRunning = false;
        let gameOver = false;
        let speed = 3;
        let spawnTimer = 0;
        let animationId = null;

        highScoreDisplay.textContent = highScore;

        function resetGame() {
            player.lane = 1;
            player.x = ROAD_X + LANE_WIDTH * 0.5 + LANE_WIDTH * player.lane - CAR_WIDTH / 2;
            traffic = [];
            orbs = [];
            score = 0;
            speed = 3;
            spawnTimer = 0;
            gameOver = false;
            scoreDisplay.textContent = '0';
            speedDisplay.textContent = '1x';
            gameOverOverlay.style.display = 'none';
            draw();
        }

        function spawnTraffic() {
            const lane = Math.floor(Math.random() * LANE_COUNT);
            const x = ROAD_X + LANE_WIDTH * lane + (LANE_WIDTH - CAR_WIDTH) / 2;
            const colors = ['#0ff', '#f0f', '#ff0', '#b0f'];
            traffic.push({
                x, y: -CAR_HEIGHT,
                width: CAR_WIDTH,
                height: CAR_HEIGHT,
                color: colors[Math.floor(Math.random() * colors.length)],
                lane
            });
        }

        function spawnOrb() {
            const lane = Math.floor(Math.random() * LANE_COUNT);
            const x = ROAD_X + LANE_WIDTH * lane + LANE_WIDTH / 2;
            orbs.push({ x, y: -ORB_RADIUS * 2, radius: ORB_RADIUS, lane });
        }

        function update() {
            if (!gameRunning || gameOver) return;

            spawnTimer++;
            if (spawnTimer > 60) {
                spawnTraffic();
                if (Math.random() < 0.3) spawnOrb();
                spawnTimer = 0;
            }

            traffic.forEach(car => car.y += speed);
            orbs.forEach(orb => orb.y += speed);

            traffic = traffic.filter(car => car.y < canvas.height + CAR_HEIGHT);
            orbs = orbs.filter(orb => orb.y < canvas.height + ORB_RADIUS * 2);

            for (const car of traffic) {
                if (
                    player.x < car.x + car.width &&
                    player.x + player.width > car.x &&
                    player.y < car.y + car.height &&
                    player.y + player.height > car.y
                ) {
                    endGame();
                    return;
                }
            }

            for (let i = orbs.length - 1; i >= 0; i--) {
                const orb = orbs[i];
                const dx = (player.x + player.width / 2) - orb.x;
                const dy = (player.y + player.height / 2) - orb.y;
                if (Math.sqrt(dx * dx + dy * dy) < ORB_RADIUS + CAR_WIDTH / 2) {
                    orbs.splice(i, 1);
                    score += 50;
                    scoreDisplay.textContent = score;
                }
            }

            score++;
            if (score % 500 === 0) {
                speed = Math.min(speed + 0.5, 8);
                speedDisplay.textContent = speed / 3 + 'x';
            }
            scoreDisplay.textContent = score;

            draw();
            animationId = requestAnimationFrame(update);
        }

        function draw() {
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#000';
            ctx.fillRect(ROAD_X, 0, ROAD_WIDTH, canvas.height);

            ctx.strokeStyle = 'rgba(0,255,255,0.3)';
            ctx.lineWidth = 2;
            for (let i = 1; i < LANE_COUNT; i++) {
                const x = ROAD_X + LANE_WIDTH * i;
                ctx.setLineDash([20, 20]);
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            ctx.shadowColor = '#0ff';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#0ff';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowBlur = 0;

            traffic.forEach(car => {
                ctx.shadowColor = car.color;
                ctx.shadowBlur = 15;
                ctx.fillStyle = car.color;
                ctx.fillRect(car.x, car.y, car.width, car.height);
                ctx.shadowBlur = 0;
            });

            orbs.forEach(orb => {
                ctx.shadowColor = '#ff0';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#ff0';
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function startGame() {
            if (gameRunning && !gameOver) return;
            if (gameOver) resetGame();
            gameRunning = true;
            startBtn.textContent = 'PLAYING';
            startBtn.disabled = true;
            update();
        }

        function endGame() {
            gameOver = true;
            gameRunning = false;
            cancelAnimationFrame(animationId);
            if (score > highScore) {
                highScore = score;
                highScoreDisplay.textContent = highScore;
                localStorage.setItem('racerHighScore', highScore);
            }
            finalScoreDisplay.textContent = score;
            gameOverOverlay.style.display = 'flex';
            startBtn.textContent = 'START';
            startBtn.disabled = false;
        }

        function handleKeydown(e) {
            if (!gameRunning || gameOver) return;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                player.lane = Math.max(0, player.lane - 1);
                player.x = ROAD_X + LANE_WIDTH * player.lane + (LANE_WIDTH - CAR_WIDTH) / 2;
            }
            if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                player.lane = Math.min(LANE_COUNT - 1, player.lane + 1);
                player.x = ROAD_X + LANE_WIDTH * player.lane + (LANE_WIDTH - CAR_WIDTH) / 2;
            }
            draw();
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', () => {
            resetGame();
            startGame();
        });
        document.addEventListener('keydown', handleKeydown);

        resetGame();
        draw();
    </script>
</body>
</html>
