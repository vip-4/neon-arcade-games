<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON 2048 // CYBERPUNK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        :root {
            --neon-cyan: #0ff;
            --neon-magenta: #f0f;
            --neon-yellow: #ff0;
            --neon-purple: #b0f;
            --dark-bg: #0a0a0f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--dark-bg);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 2px,
                rgba(0, 0, 0, 0.15) 4px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .chromatic-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            text-shadow:
                0.05em 0 0 rgba(255, 0, 0, 0.75),
                -0.05em -0.025em 0 rgba(0, 255, 255, 0.75),
                0.025em 0.05em 0 rgba(0, 255, 0, 0.75);
            animation: glitch 2s infinite linear alternate-reverse;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .subtitle {
            font-size: 1rem;
            color: var(--neon-magenta);
            margin-top: 0.5rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            text-shadow:
                0.05em 0 0 rgba(255, 0, 255, 0.5),
                -0.05em 0 0 rgba(0, 255, 255, 0.5);
        }

        .game-container {
            background: #000;
            border: 3px solid var(--neon-cyan);
            border-radius: 15px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            box-shadow:
                0 0 30px rgba(0, 255, 255, 0.3),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
            position: relative;
            max-width: 95vw;
        }

        .game-container::before {
            content: "";
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta), var(--neon-yellow), var(--neon-cyan));
            background-size: 400% 400%;
            border-radius: 18px;
            z-index: -1;
            animation: borderGlow 4s ease infinite;
        }

        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; opacity: 0.5; }
            50% { background-position: 100% 50%; opacity: 1; }
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0.8rem;
            background: rgba(0, 255, 255, 0.05);
            border: 1px dashed var(--neon-cyan);
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
        }

        .score-display {
            font-size: 1.3rem;
            color: var(--neon-yellow);
            font-weight: 700;
            text-shadow:
                0.05em 0 0 rgba(255, 255, 0, 0.75),
                -0.05em 0 0 rgba(255, 0, 255, 0.75);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: rgba(0, 255, 255, 0.05);
            padding: 10px;
            border-radius: 10px;
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 20px rgba(176, 0, 255, 0.4);
            touch-action: none;
        }

        .cell {
            width: 70px;
            height: 70px;
            background: rgba(0, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            transition: all 0.15s ease;
            position: relative;
        }

        .tile-2 { background: rgba(0, 255, 255, 0.25); color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }
        .tile-4 { background: rgba(0, 255, 255, 0.35); color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan); }
        .tile-8 { background: rgba(255, 0, 255, 0.35); color: var(--neon-magenta); text-shadow: 0 0 15px var(--neon-magenta); }
        .tile-16 { background: rgba(255, 0, 255, 0.45); color: var(--neon-magenta); text-shadow: 0 0 20px var(--neon-magenta); }
        .tile-32 { background: rgba(255, 255, 0, 0.35); color: var(--neon-yellow); text-shadow: 0 0 15px var(--neon-yellow); }
        .tile-64 { background: rgba(255, 255, 0, 0.5); color: var(--neon-yellow); text-shadow: 0 0 25px var(--neon-yellow); }
        .tile-128 { background: rgba(176, 0, 255, 0.45); color: var(--neon-purple); text-shadow: 0 0 25px var(--neon-purple); font-size: 1.6rem; }
        .tile-256 { background: rgba(176, 0, 255, 0.55); color: var(--neon-purple); text-shadow: 0 0 30px var(--neon-purple); font-size: 1.6rem; }
        .tile-512 { background: rgba(255, 0, 128, 0.5); color: #f08; text-shadow: 0 0 30px #f08; font-size: 1.6rem; }
        .tile-1024 { background: rgba(255, 0, 128, 0.65); color: #f08; text-shadow: 0 0 35px #f08; font-size: 1.3rem; }
        .tile-2048 { background: rgba(255, 215, 0, 0.8); color: #ff0; text-shadow: 0 0 40px #ff0; font-size: 1.3rem; animation: winPulse 1s infinite; }
        .tile-super { background: rgba(255, 0, 0, 0.7); color: #f00; text-shadow: 0 0 40px #f00; font-size: 1.1rem; }

        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            justify-content: center;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--neon-yellow);
            color: var(--neon-yellow);
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            text-shadow: 0 0 10px var(--neon-yellow);
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.3);
            border-radius: 8px;
        }

        .btn:hover {
            background: var(--neon-yellow);
            color: #000;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.8);
        }

        .instructions {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--neon-cyan);
            opacity: 0.8;
            text-align: center;
            line-height: 1.6;
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            z-index: 100;
            display: none;
        }

        .game-over-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow:
                0.05em 0 0 rgba(255, 0, 0, 0.75),
                -0.05em -0.025em 0 rgba(0, 255, 255, 0.75),
                0.025em 0.05em 0 rgba(0, 255, 0, 0.75);
            animation: glitch 0.5s infinite;
        }

        .final-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--neon-magenta);
            margin-top: 1rem;
        }

        @media (max-width: 640px) {
            .chromatic-text {
                font-size: 2rem;
            }
            .subtitle {
                font-size: 0.8rem;
                letter-spacing: 0.3em;
            }
            .cell {
                width: 60px;
                height: 60px;
                font-size: 1.4rem;
            }
            .grid-container {
                gap: 6px;
                padding: 6px;
            }
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="chromatic-text">NEON 2048</div>
        <div class="subtitle">CYBERPUNK EDITION</div>
    </div>

    <div class="game-container">
        <div class="info-panel">
            <div class="score-display">SCORE: <span id="score">0</span></div>
            <div class="high-score">BEST: <span id="highScore">0</span></div>
        </div>
        <div class="grid-container" id="grid"></div>
        <div class="controls">
            <button class="btn" id="newGameBtn">NEW GAME</button>
        </div>
        <div class="instructions">
            ARROW KEYS / WASD / SWIPE TO MOVE<br>
            JOIN TILES TO REACH 2048
        </div>
        <div class="game-over-overlay" id="gameOverOverlay">
            <div class="game-over-text" id="gameOverText">GAME OVER</div>
            <div class="final-score">SCORE: <span id="finalScore">0</span></div>
            <button class="btn" id="restartBtn" style="margin-top: 1.5rem;">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');
        const newGameBtn = document.getElementById('newGameBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const gameOverText = document.getElementById('gameOverText');
        const finalScoreDisplay = document.getElementById('finalScore');

        let cells = [];
        let board = Array(16).fill(0);
        let score = 0;
        let highScore = parseInt(localStorage.getItem('2048HighScore')) || 0;
        let gameOver = false;
        let won = false;

        highScoreDisplay.textContent = highScore;

        function init() {
            cells = [];
            board = Array(16).fill(0);
            score = 0;
            gameOver = false;
            won = false;
            scoreDisplay.textContent = '0';
            gameOverOverlay.style.display = 'none';
            grid.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                grid.appendChild(cell);
                cells.push(cell);
            }
            addRandomTile();
            addRandomTile();
            render();
        }

        function addRandomTile() {
            const empty = board.map((val, idx) => val === 0 ? idx : null).filter(val => val !== null);
            if (empty.length === 0) return;
            const idx = empty[Math.floor(Math.random() * empty.length)];
            board[idx] = Math.random() < 0.9 ? 2 : 4;
        }

        function render() {
            board.forEach((val, i) => {
                cells[i].textContent = val === 0 ? '' : val;
                cells[i].className = 'cell';
                if (val > 0) {
                    const cls = val <= 2048 ? `tile-${val}` : 'tile-super';
                    cells[i].classList.add(cls);
                }
            });
        }

        function getRow(row) {
            return board.slice(row * 4, row * 4 + 4);
        }

        function getCol(col) {
            return [board[col], board[col + 4], board[col + 8], board[col + 12]];
        }

        function setRow(row, values) {
            for (let i = 0; i < 4; i++) board[row * 4 + i] = values[i];
        }

        function setCol(col, values) {
            for (let i = 0; i < 4; i++) board[col + i * 4] = values[i];
        }

        function slide(row) {
            let arr = row.filter(val => val !== 0);
            let merged = Array(4).fill(false);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1] && !merged[i] && !merged[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                    merged[i] = true;
                    if (arr[i] === 2048 && !won) {
                        won = true;
                    }
                }
            }
            while (arr.length < 4) arr.push(0);
            return arr;
        }

        function moveLeft() {
            let moved = false;
            for (let r = 0; r < 4; r++) {
                const original = getRow(r);
                const newRow = slide(original);
                setRow(r, newRow);
                if (JSON.stringify(original) !== JSON.stringify(newRow)) moved = true;
            }
            return moved;
        }

        function moveRight() {
            let moved = false;
            for (let r = 0; r < 4; r++) {
                const original = getRow(r);
                const reversed = [...original].reverse();
                const newRow = slide(reversed).reverse();
                setRow(r, newRow);
                if (JSON.stringify(original) !== JSON.stringify(newRow)) moved = true;
            }
            return moved;
        }

        function moveUp() {
            let moved = false;
            for (let c = 0; c < 4; c++) {
                const original = getCol(c);
                const newCol = slide(original);
                setCol(c, newCol);
                if (JSON.stringify(original) !== JSON.stringify(newCol)) moved = true;
            }
            return moved;
        }

        function moveDown() {
            let moved = false;
            for (let c = 0; c < 4; c++) {
                const original = getCol(c);
                const reversed = [...original].reverse();
                const newCol = slide(reversed).reverse();
                setCol(c, newCol);
                if (JSON.stringify(original) !== JSON.stringify(newCol)) moved = true;
            }
            return moved;
        }

        function canMove() {
            if (board.includes(0)) return true;
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const current = board[r * 4 + c];
                    if (c < 3 && current === board[r * 4 + c + 1]) return true;
                    if (r < 3 && current === board[(r + 1) * 4 + c]) return true;
                }
            }
            return false;
        }

        function endGame(text) {
            gameOver = true;
            if (score > highScore) {
                highScore = score;
                highScoreDisplay.textContent = highScore;
                localStorage.setItem('2048HighScore', highScore);
            }
            gameOverText.textContent = text;
            finalScoreDisplay.textContent = score;
            gameOverOverlay.style.display = 'flex';
        }

        function playTurn(direction) {
            if (gameOver) return;
            let moved = false;
            switch (direction) {
                case 'left': moved = moveLeft(); break;
                case 'right': moved = moveRight(); break;
                case 'up': moved = moveUp(); break;
                case 'down': moved = moveDown(); break;
            }
            if (moved) {
                addRandomTile();
                render();
                scoreDisplay.textContent = score;
                if (won) {
                    endGame('YOU WIN!');
                } else if (!canMove()) {
                    endGame('GAME OVER');
                }
            }
        }

        function handleKeydown(e) {
            if (gameOver) return;
            switch (e.code) {
                case 'ArrowLeft':
                case 'KeyA':
                    e.preventDefault();
                    playTurn('left');
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    e.preventDefault();
                    playTurn('right');
                    break;
                case 'ArrowUp':
                case 'KeyW':
                    e.preventDefault();
                    playTurn('up');
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    e.preventDefault();
                    playTurn('down');
                    break;
            }
        }

        let touchStartX = 0;
        let touchStartY = 0;

        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }

        function handleTouchEnd(e) {
            if (gameOver) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);
            if (Math.max(absDx, absDy) < 30) return;
            if (absDx > absDy) {
                playTurn(dx > 0 ? 'right' : 'left');
            } else {
                playTurn(dy > 0 ? 'down' : 'up');
            }
        }

        newGameBtn.addEventListener('click', init);
        restartBtn.addEventListener('click', init);
        document.addEventListener('keydown', handleKeydown);
        grid.addEventListener('touchstart', handleTouchStart, { passive: true });
        grid.addEventListener('touchend', handleTouchEnd, { passive: true });

        init();
    </script>
</body>
</html>
